# compose.yaml · Todos los contenedores de la sede, en un solo fichero (DS2)
#
# Se levanta desde esta carpeta con:   docker compose up -d --build
#
# - Las rutas que empiezan por ./ son relativas a esta carpeta: ./web/conf es web/conf del repositorio.
# - Las ${CLAVES} se leen solas del fichero .env de esta carpeta.
# - Imágenes siempre con versión: nada de latest (DS5).

services:

  # ============================================================ web · IAW
  web:
    build: ./web                      # la imagen se construye con web/Dockerfile

    ports:
      - "80:80"                       # puerto del servidor : puerto del contenedor

    volumes:
      # El fichero de contraseñas de la intranet, fuera de Git: lo genera instalar.sh (DS3).
      - ./secretos/intranet.htpasswd:/etc/apache2/conf-custom/htpasswd:ro

    environment:                      # variables que ve PHP con getenv()
      DB_HOST: db                     # el nombre del servicio de la base de datos, más abajo
      DB_NOMBRE: ${DB_NOMBRE}
      # D3: la web tiene su propio rol, que solo lee clientes en su BD (db/init/03-claves.sh).
      # No es el administrador: ese no entra por red (db/conf/pg_hba.conf, línea 2).
      DB_USUARIO: ${WEB_USUARIO}
      DB_CLAVE: ${WEB_CLAVE}

    networks: [frontal, trasera]      # frontal para el aula, trasera para hablar con db

    depends_on:
      db:
        condition: service_healthy    # no arranca hasta que la base de datos está lista

    restart: unless-stopped           # vuelve sola cuando se reinicia el servidor


  # ============================================================ db · ASGBD
  # Nace con todo al crear el volumen por primera vez (DS6), en este orden:
  #   01-esquema.sql  BD de la web: tabla clientes y sus 25 filas
  #   02-bifi.sql     roles, base bifi, tablas, vistas y datos del BIFI (Reto 1)
  #   03-claves.sh    contraseñas desde .env y rol propio de la web
  # instalar.sh vuelve a lanzar 02 y 03 en cada ejecución (son idempotentes).
  # Configuración en db/conf/ (RA2): todo explicado en db/README.md.
  db:
    image: postgres:16-alpine         # versión mayor fijada (D1)

    # Nuestro postgresql.conf en vez del de PGDATA (C1). Él dice dónde está pg_hba.conf.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]

    environment:
      POSTGRES_DB: ${DB_NOMBRE}
      POSTGRES_USER: ${DB_USUARIO}    # el administrador (admin_sede): solo por el socket
      POSTGRES_PASSWORD: ${DB_CLAVE}
      # Para db/init/03-claves.sh
      DB_NOMBRE: ${DB_NOMBRE}
      WEB_USUARIO: ${WEB_USUARIO}
      WEB_CLAVE: ${WEB_CLAVE}
      PANEL_CLAVE: ${PANEL_CLAVE}
      RESP_DEMO_CLAVE: ${RESP_DEMO_CLAVE}

    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # esquema + filas al nacer
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Con la red del aula y los nombres de .env: lo genera instalar.sh (paso 5)
      - ./generado/db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - datos:/var/lib/postgresql/data             # datos en volumen: sobreviven

    # C2: el 5432 solo en la IP del aula, para los responsables con psql.
    # IP_AULA la copia instalar.sh de sede.env a .env (Compose solo lee .env).
    ports:
      - "${IP_AULA}:5432:5432"

    # trasera: la web y el panel. bd-aula: solo para publicar el puerto
    # (una red internal no publica puertos). Quién entra lo decide pg_hba.conf.
    networks: [trasera, bd-aula]

    healthcheck:                      # cómo sabe Compose que la base de datos está lista
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

    # C9: docker compose stop manda SIGINT (STOPSIGNAL de la imagen): parada fast.
    # Si a los 10 s no ha terminado, Docker manda SIGKILL y al arrancar hay recuperación.
    # 30 s le dan tiempo al checkpoint final aunque haya escrituras pendientes.
    stop_grace_period: 30s

    restart: unless-stopped


  # ============================================================ dns · SRI
  # ns1 (10.4.0.1). El secundario ns2 (10.4.0.2) es un nodo de GNS3: dns/ns2/.
  dns:
    image: internetsystemsconsortium/bind9:9.18

    ports:                            # el 53 del anfitrión queda libre: instalar.sh apaga
      - "53:53/tcp"                   # el stub de systemd-resolved (paso 2)
      - "53:53/udp"

    volumes:
      # El named.conf de esta imagen no incluye nada: el nuestro carga options y local.
      - ./dns/config/named.conf:/etc/bind/named.conf:ro
      - ./dns/config/named.conf.local:/etc/bind/named.conf.local:ro
      # Con la IP y la red del aula de sede.env: los genera instalar.sh (paso 5)
      - ./generado/dns/named.conf.options:/etc/bind/named.conf.options:ro
      - ./generado/dns/zones:/var/lib/bind:ro

    networks: [frontal]

    restart: unless-stopped


  # ============================================================ git · Forgejo (optativo)
  # git.calatayud.empresa.lan responde vía proxy en web/conf/site.conf.
  # SSH de git por el 2222 (el 22 del anfitrión es del sshd del servidor).
  git:
    image: codeberg.org/forgejo/forgejo:8

    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # F2: sin registro libre; las cuentas las crea el administrador
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Las URLs de clonado que enseña Forgejo: nombre del proxy y SSH por el 2222
      FORGEJO__server__ROOT_URL: http://git.calatayud.empresa.lan/
      FORGEJO__server__SSH_DOMAIN: git.calatayud.empresa.lan
      FORGEJO__server__SSH_PORT: "2222"

    ports:
      - "2222:22"

    volumes:
      - ./forgejo/data:/data                       # la imagen guarda todo en /data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    networks: [frontal]

    restart: unless-stopped


  # ============================================================ panel · IAW (reto 1)
  # Panel del BIFI. panel.calatayud.empresa.lan responde vía proxy en web/conf/site.conf.
  # Solo se sirve panel/public/ (ver panel/Dockerfile).
  # RA6: los datos están en la base bifi, con el rol panel (privilegio mínimo).
  panel:
    build: ./panel

    ports:
      - "8082:80"                     # para probar sin el proxy: http://IP_AULA:8082

    environment:
      DB_HOST: db
      DB_NOMBRE: bifi
      DB_USUARIO: panel
      DB_CLAVE: ${PANEL_CLAVE}

    # frontal: la misma red que web, para el proxy. trasera: para llegar a db.
    networks: [frontal, trasera]

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================ kea · SRI · ASO
  # DHCP de la red interna (10.4.0.10-200). En la red del anfitrión: tiene que
  # oír los broadcast de INTERFAZ_INTERNA. La configuración la genera instalar.sh
  # (paso 3) desde red/kea/dhcp4.json con los datos de sede.env.
  kea:
    image: jonasal/kea-dhcp4:3.0
    # La imagen no trae CMD: sin -c, kea-dhcp4 imprime la ayuda, sale con
    # error y Docker lo reinicia en bucle (Restarting).
    command: ["-c", "/kea/config/dhcp4.json"]

    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]     # sockets en bruto para DHCP

    volumes:
      - ./generado/kea/dhcp4.json:/kea/config/dhcp4.json:ro
      - kea-leases:/kea/leases                     # concesiones: sobreviven

    restart: unless-stopped


volumes:
  datos:                              # Docker los crea la primera vez
  kea-leases:

networks:
  frontal:                            # Docker crea las dos redes: nada de external
    ipam:
      config:
        # Subred fija: la ACL red_interna de dns/config/named.conf.options la
        # permite (las consultas del propio servidor llegan desde su puerta, .0.1)
        - subnet: 172.22.0.0/16
  trasera:
    internal: true                    # red sin salida: solo se ven los contenedores entre sí
  bd-aula:                            # solo db: por aquí entra el 5432 publicado (C2)
