# db/conf/pg_hba.conf · ASGBD RA2 (C3, C4)
#
# Plantilla: instalar.sh cambia las __MARCAS__ con los valores de .env y
# sede.env y deja el resultado en generado/db/pg_hba.conf, que es el que monta
# compose.yaml. Se lee de arriba abajo y gana la PRIMERA línea que coincide.
#
#   Tras cambiarlo:  sudo ./instalar.sh   (o regenerarlo y SELECT pg_reload_conf();)
#   Ver cómo lo ha entendido el servidor:
#     SELECT line_number, database, user_name, address, auth_method, error FROM pg_hba_file_rules;
#
# Cada línea, con su porqué, en db/README.md.

# TIPO  BASE              USUARIO          ORIGEN            MÉTODO

# 1. Por el socket: solo quien ya es administrador del servidor (docker compose exec)
local   all               all                                trust

# 2. El administrador no entra por red, desde ningún sitio. Va antes que las demás.
host    all               __ADMIN__        all               reject

# 3. La web, desde la red de Compose, solo a su base
host    __DB_NOMBRE__     __WEB_USUARIO__  samenet           scram-sha-256

# 4. El panel, desde la red de Compose, solo a bifi
host    bifi              panel            samenet           scram-sha-256

# 5. Desde el propio servidor no: llega con su IP del aula, que está dentro de la red de la 6.
#    Un responsable se conecta desde SU equipo (P3).
host    bifi              +responsables    __IP_AULA__/32    reject

# 6. Los responsables (grupo responsables), desde la red del aula, solo a bifi
host    bifi              +responsables    __RED_AULA__      scram-sha-256

# 7. Todo lo demás, rechazado. No es la línea de la imagen (host all all all scram-sha-256).
host    all               all              all               reject
