# db/conf/postgresql.conf · ASGBD RA2 (C1, C2, C4, C5, C6)
#
# Solo lo que cambiamos: lo demás toma el valor por defecto de PostgreSQL 16.
# Lo carga compose.yaml con  postgres -c config_file=/etc/postgresql/postgresql.conf
# Cada parámetro, con su porqué, en db/README.md.
#
#   Recargar (sighup):   docker compose exec db psql -U "$DB_USUARIO" -c 'SELECT pg_reload_conf()'
#   Reiniciar (postmaster): docker compose restart db

# ---------------------------------------------------------------- red (reiniciar)
listen_addresses = '*'          # todas las interfaces del contenedor: sin esto, solo localhost
port = 5432
# El pg_hba.conf no está en PGDATA: lo genera instalar.sh desde db/conf/pg_hba.conf
hba_file = '/etc/postgresql/pg_hba.conf'

# ---------------------------------------------------------------- conexiones (reiniciar)
# web 20 + panel 10 + responsables (2 cada uno, hasta 5) 10 + reservadas 3 + margen 7
max_connections = 50
superuser_reserved_connections = 3

# ---------------------------------------------------------------- autenticación (recargar)
password_encryption = scram-sha-256
authentication_timeout = 30s    # quien no termina de autenticarse no ocupa plaza

# ---------------------------------------------------------------- tiempos por defecto (recargar)
# Para todos; el panel y los responsables tienen los suyos por rol (02-bifi.sql).
idle_in_transaction_session_timeout = 5min
tcp_keepalives_idle = 300       # conexiones muertas por un corte de red

# ---------------------------------------------------------------- registro (recargar)
# Cada conexión deja su línea con usuario, base y origen: así se prueban P1 a P6.
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d %h '
log_timezone = 'Europe/Madrid'

# ---------------------------------------------------------------- valores de las sesiones
timezone = 'Europe/Madrid'
datestyle = 'ISO, DMY'
lc_messages = 'C'               # mensajes en inglés: los de la teoría y los que salen al buscar
