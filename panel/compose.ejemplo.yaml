# Lo que se añade al compose.yaml de la sede. Apache de la sede hace de proxy a panel.<sede>.empresa.lan
# (o se publica un puerto mientras tanto).
services:
  panel:
    build: ./panel
    restart: unless-stopped
    volumes:
      - datos-panel:/var/www/panel/datos
    # ports: ["8081:80"]   # para probar sin el proxy de la sede

volumes:
  datos-panel:
