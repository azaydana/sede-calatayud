# Lo que se añade al compose.yaml de la sede. Apache de la sede hace de proxy a panel.<sede>.empresa.lan
# (o se publica un puerto mientras tanto).
services:
  panel:
    build: ./panel
    restart: unless-stopped
    environment:              # RA6: la base bifi con el rol panel
      DB_HOST: db
      DB_NOMBRE: bifi
      DB_USUARIO: panel
      DB_CLAVE: ${PANEL_CLAVE}
    networks: [frontal, trasera]
    depends_on:
      db:
        condition: service_healthy
    # ports: ["8081:80"]   # para probar sin el proxy de la sede
