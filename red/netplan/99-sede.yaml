# red/netplan/99-sede.yaml · SRI · ASO
# Esta ficha lleva __MARCADORES__: instalar.sh la copia a /etc/netplan/99-sede.yaml
# sustituyéndolos con los valores de sede.env. No editar el fichero instalado.
#
# Una sola tarjeta (INTERFAZ_AULA = INTERFAZ_INTERNA en sede.env) con dos IPs:
# - IP_AULA (192.168.6.118): la del aula, la que se usa para SSH y la web publicada.
# - IP_INTERNA (10.4.0.1): puerta de la red interna de GNS3 y donde escucha Kea
#   (DHCP). Sin puerta de enlace propia: la salida la hace el NAT de red/nftables.

network:
  version: 2
  renderer: networkd
  ethernets:
    __INTERFAZ_AULA__:
      dhcp4: false
      addresses:
        - __IP_AULA__/24
        - __IP_INTERNA__/24
      routes:
        - to: default
          via: __PUERTA_AULA__
      nameservers:
        # El servidor resuelve con el del centro (sede.env); el DNS de la sede es
        # para los clientes del aula y de la interna.
        addresses: [__RESOLUTOR_CENTRO__]
