#!/usr/sbin/nft -f
#
# red/nftables/99-sede-nat.conf · SRI · ASO
# Esta ficha lleva __MARCADORES__: instalar.sh la genera en /etc/nftables.d/sede-nat.conf
# y la carga con sede-nat.service.
#
# NAT (masquerade): el tráfico que sale de la red interna hacia el aula
# se disfraza con la IP del servidor. Sin esto, el 192.168.6.x no sabe
# volver hacia 10.4.0.x.
#
# Solo toca SU tabla, sede_nat: no hace flush del ruleset entero, así no
# machaca las reglas que Docker crea por su cuenta (interferencia evitada).

table ip sede_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # __INTERFAZ_AULA__ e __IP_AULA__ los sustituye instalar.sh (sede.env)
        oifname "__INTERFAZ_AULA__" ip saddr 10.4.0.0/24 masquerade
    }
}
