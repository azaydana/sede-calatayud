# red/resolved/90-sede.conf · SRI · ASO
# instalar.sh lo copia a /etc/systemd/resolved.conf.d/ (paso 2).
# Apaga el stub de 127.0.0.53:53: el puerto 53 del servidor es del contenedor dns
# (compose.yaml). Sin esto Docker no puede publicar el 53 (address already in use).
[Resolve]
DNSStubListener=no
