# sistema/ssh/00-sede-hardening.conf · ASO
# instalar.sh lo copia a /etc/ssh/sshd_config.d/ y valida con sshd -t antes de recargar.
#
# Se llama 00-…: sshd se queda con el PRIMER valor que lee, y Ubuntu trae
# 50-cloud-init.conf con PasswordAuthentication yes. Con 99-… ganaba cloud-init.
#
# IMPORTANTE (orden en instalar.sh): se instala DESPUÉS de crear los usuarios con
# sus claves. Desactivar contraseña antes de poner claves = quedarse fuera del servidor.

# Solo acceso por clave: contraseñas fuera (fuerza bruta imposible)
PasswordAuthentication no
KbdInteractiveAuthentication no

# root no inicia sesión con contraseña; con clave solo si se necesita rescate
PermitRootLogin prohibit-password

# Menos superficie: nada de X ni de túneles inútiles en un servidor de aula
X11Forwarding no

# Las sesiones inactivas se cortan tras 2 avisos de 30s
ClientAliveInterval 30
ClientAliveCountMax 2
