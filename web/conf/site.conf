# IAW · VirtualHosts de la sede Calatayud.
# Entra en la imagen como 000-default.conf (web/Dockerfile).
# Nombres y rutas tomados de sede.env: www/intranet/git son CNAME hacia srv.

# Web pública
<VirtualHost *:80>
    ServerName www.calatayud.empresa.lan
    DocumentRoot /var/www/html/publica
    <Directory /var/www/html/publica>
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Intranet: auth basic; la ruta del fichero es la del volumen de compose.yaml
<VirtualHost *:80>
    ServerName intranet.calatayud.empresa.lan
    DocumentRoot /var/www/html/privada
    <Directory /var/www/html/privada>
        AuthType Basic
        AuthName "Intranet Calatayud"
        AuthUserFile /etc/apache2/conf-custom/htpasswd
        Require valid-user
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# git -> Forgejo (F1/R4). Sin ProxyPreserveHost Forgejo genera URLs mal.
<VirtualHost *:80>
    ServerName git.calatayud.empresa.lan
    ProxyPreserveHost On
    ProxyPass / http://forgejo:3000/
    ProxyPassReverse / http://forgejo:3000/
    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
